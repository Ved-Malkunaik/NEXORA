name: Contract

on:
  push:
    branches: [main]
    paths: ["contract/**", ".github/workflows/contract.yml"]
  pull_request:
    paths: ["contract/**", ".github/workflows/contract.yml"]

defaults:
  run:
    working-directory: contract

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: bash ../.github/scripts/run-annotated.sh clippy cargo clippy --all-features --lib --tests -- --deny warnings --warn clippy::all --warn clippy::nursery

  test:
    name: Unit and sandbox integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - name: Build wasm
        run: cargo near build non-reproducible-wasm
      - name: Unit tests
        run: bash ../.github/scripts/run-annotated.sh unit-tests cargo test --lib
      - name: Sandbox integration tests
        run: bash ../.github/scripts/run-annotated.sh integration-tests cargo test --test integration -- --test-threads=1 --nocapture

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
